<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tower Idiomas</title>
    
    <link rel="stylesheet" href="./landingpage/styles/estilo.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav id="navbar">
        <div class="container nav-content">
            <div class="logo">
                <div class="logo-icon">T</div>
                <span class="logo-text">The Tower Idiomas</span>
            </div>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="#home">Home</a></li>
                <li><a href="#modalidades">Modalidades</a></li>
                <li><a href="#tipos">Tipos de Aulas</a></li>
                <li><a href="#metodologia">Metodologia</a></li>
                <li><a href="#eventos">Eventos</a></li>
                <li><a href="#planos">Planos</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>

            <button class="mobile-toggle" id="mobileToggle">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <section id="home"></section>
    <section id="modalidades" class="section bg-white"></section>
    <section id="tipos" class="section bg-white"></section>
    <section id="metodologia" class="section"></section>
    <section id="eventos" class="section bg-white"></section>
    <section id="planos" class="section planos-bg"></section>
    <section id="sobre" class="section bg-white"></section>

    <footer id="contato"></footer>

    <div class="modal" id="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h3 id="modalTitle"></h3>
            <p id="modalDescription"></p>
        </div>
    </div>

    <script type="module" src="./landingpage/javaScript/script.js"></script>

</body>
</html>
